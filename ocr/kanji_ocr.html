<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji OCR Test</title>
    <link rel="stylesheet" href="./ocr.css">
</head>

<body>
    <div id="cover">
        <h1>Loading...</h1>
        <br>
        <p>This can take some time on first boot!</p>
    </div>

    <div class="container">
        <h1>How it works...</h1>
        <br>
        <p>Point your camera at Japanese text, then it will automatically scan and catalog what you've seen! Cool, isn't it? It runs offline; images stay on your device.</p>

        <button id="start">Get started</button>
        <button id="testButton">Test</button>
    </div>

    <div id="startup" class="container">
        <h1>First, what's your name?</h1>
        <input type="text" name="nameInput" id="nameInput">
        <label for="nameInput">Please enter your name here!</label>
    </div>
</body>

<script type="module" src="./index.mjs"></script>

</html>
